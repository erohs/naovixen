# Checks every pull request and every push to main. Cloudflare Workers Builds deploys on its own.
name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test

  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    name: end-to-end (${{ matrix.engine }})
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - run: pnpm test:e2e --project=${{ matrix.engine }} --project=${{ matrix.engine }}-no-js
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.engine }}
          path: blob-report/
          retention-days: 1

  end-to-end-report:
    if: ${{ !cancelled() }}
    needs: end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter=html,json ./all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
      - run: node tests/e2e-summary.ts results.json
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Serve the built site as Cloudflare would
        run: |
          pnpm exec wrangler dev --port 8787 &
          timeout 60 sh -c 'until curl -sf http://127.0.0.1:8787/ > /dev/null; do sleep 1; done'
      - run: pnpm test:lighthouse
        timeout-minutes: 8
